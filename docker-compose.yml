services:
  db:
    image: postgres:16
    container_name: mini_trello_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  app:
    build: .
    container_name: mini_trello_app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: 3000
      NODE_ENV: development
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    command: npm run start:dev
volumes:
  db_data: